name: Tamaloci
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Tamaloci:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Rendering
      - path: Domain
      - path: Persistence
      - path: Resources/Assets.xcassets
      - path: Resources/3D
        buildPhase: resources
        optional: true
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.Tamaloci
        PRODUCT_NAME: Tamaloci
        INFOPLIST_KEY_CFBundleDisplayName: 'TAMA"LO"CI'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: 'TAMA"LO"CI uses the camera for a short face scan to style your pet avatar. Photos are not kept after setup.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'TAMA"LO"CI uses your location once to check local weather so temperature can affect your pet’s comfort. Location is not stored.'
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/Tamaloci.entitlements
        ENABLE_TESTABILITY: YES
    dependencies: []
  TamalociTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Tamaloci
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.local.TamalociTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tamaloci.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tamaloci"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Tamaloci:
    build:
      targets:
        Tamaloci: all
        TamalociTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TamalociTests
